<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Catálogo - UNNA</title>
    
    <!-- Redirecionamento Automático (Ocorre após 3 segundos) -->
    <meta http-equiv="refresh" content="3; url=https://unnamodas.github.io/catalogo-principal/">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            font-weight: 400;
            letter-spacing: 0.05em;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            font-size: 14px;
            color: #666666;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 40px;
            max-width: 400px;
            line-height: 1.6;
            padding: 0 20px;
        }

        .btn-redirect {
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 30px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.3s ease;
        }

        .btn-redirect:hover {
            background-color: #333333;
            transform: translateY(-2px);
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinner"></div>
    
    <h1>Nosso catálogo mudou!</h1>
    <p>Aguarde um instante... Você está sendo redirecionada para o nosso novo catálogo atualizado.</p>
    
    <!-- Link manual caso a internet da cliente trave e o automático falhe -->
    <a href="https://unnamodas.github.io/catalogo-principal/" class="btn-redirect">Acessar Novo Catálogo</a>

    <script>
        // Plano B: Força o redirecionamento via JavaScript caso o <meta> falhe
        setTimeout(function() {
            window.location.href = "https://unnamodas.github.io/catalogo-principal/";
        }, 3500);
    </script>

</body>
</html>
